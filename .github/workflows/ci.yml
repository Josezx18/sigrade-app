name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  DATABASE_URL: "postgresql://sigrade:sigrade_dev@localhost:5432/sigrade?schema=public"
  APP_DATABASE_URL: "postgresql://sigrade_app:sigrade_app_dev@localhost:5432/sigrade?schema=public"
  JWT_SECRET: "ci-jwt-secret-long-enough-for-signing"
  JWT_REFRESH_SECRET: "ci-jwt-refresh-secret-long-enough"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint API
        run: npx nx run api:lint

      - name: Lint Web
        run: npx nx run web:lint

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.app.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sigrade
          POSTGRES_USER: sigrade
          POSTGRES_PASSWORD: sigrade_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Enable row-level security policies
        run: |
          command -v psql || (apt-get update && apt-get install -y postgresql-client)
          psql "$DATABASE_URL" -f prisma/apply-rls.sql

      - name: Seed the database
        run: npx prisma db seed

      - name: API unit tests
        run: npx nx run api:test -- --testPathPatterns="test/unit"

      - name: API e2e tests
        run: npx nx run api:test -- --testPathPatterns="e2e-spec"

      - name: Web tests
        run: npx nx test web

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build API
        run: npx nx run api:build

      - name: Build Web
        run: npx nx run web:build