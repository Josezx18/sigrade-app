services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sigrade-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigrade_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sigrade}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigrade -d sigrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sigrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sigrade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sigrade}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sigrade_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: sigrade-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 ${MINIO_ROOT_USER:-sigrade} ${MINIO_ROOT_PASSWORD:-sigrade_dev}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb minio/sigrade-evidences --ignore-existing;
      /usr/bin/mc mb minio/sigrade-documents --ignore-existing;
      /usr/bin/mc mb minio/sigrade-avatars --ignore-existing;
      /usr/bin/mc anonymous set public minio/sigrade-avatars;
      echo 'MinIO buckets created';
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sigrade-api
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sigrade}:${POSTGRES_PASSWORD:-sigrade_dev}@postgres:5432/${POSTGRES_DB:-sigrade}?schema=public"
      APP_DATABASE_URL: "postgresql://sigrade_app:sigrade_app_dev@postgres:5432/${POSTGRES_DB:-sigrade}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: 9000
      CORS_ORIGIN: "http://localhost:4200"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sigrade-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: sigrade-network
