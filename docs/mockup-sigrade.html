<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGRADE — Plataforma de Gestión Educativa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #f0f2f5; color: #1a1a2e; font-size: 10pt; overflow: hidden; height: 100vh;
  }
  /* ===== LOGIN ===== */
  #login-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a2463 0%, #1e88e5 60%, #0d47a1 100%);
    transition: opacity .6s, transform .6s;
  }
  #login-screen.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
  .login-box {
    background: #fff; border-radius: 16px; padding: 40px; width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center;
  }
  .login-box .logo { font-size: 40px; margin-bottom: 6px; }
  .login-box h1 { font-size: 18pt; color: #0a2463; }
  .login-box .sub { font-size: 9pt; color: #888; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border: 1px solid #ddd;
    border-radius: 8px; font-size: 10pt; outline: none;
  }
  .login-box input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30,136,229,.15); }
  .login-box button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 8px;
    background: #0a2463; color: #fff; font-size: 11pt; font-weight: 600; cursor: pointer;
  }
  .login-box button:hover { background: #1a3a7a; }
  .login-box .hint { font-size: 8pt; color: #aaa; margin-top: 12px; }
  /* ===== LAYOUT ===== */
  #app { display: none; height: 100vh; }
  #app.active { display: flex; }
  .sidebar {
    width: 220px; background: #0a2463; color: #fff; display: flex; flex-direction: column;
    flex-shrink: 0; transition: width .3s;
  }
  .sidebar .brand {
    padding: 18px 16px; font-size: 13pt; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar .menu { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar .menu-title { font-size: 7.5pt; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.4); padding: 12px 16px 4px; }
  .sidebar .menu-item {
    padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 9.5pt; color: rgba(255,255,255,.7); transition: all .2s; border-left: 3px solid transparent;
  }
  .sidebar .menu-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .sidebar .menu-item.active { background: rgba(255,255,255,.12); color: #fff; border-left-color: #42a5f5; }
  .sidebar .menu-item .icon { font-size: 12pt; width: 24px; text-align: center; }
  .sidebar .user-card {
    padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px;
  }
  .sidebar .user-card .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #42a5f5;
    display: flex; align-items: center; justify-content: center; font-size: 11pt; color: #fff; font-weight: 700;
  }
  .sidebar .user-card .name { font-size: 9pt; font-weight: 600; }
  .sidebar .user-card .role-label { font-size: 7.5pt; color: rgba(255,255,255,.5); text-transform: uppercase; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 54px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center;
    padding: 0 24px; gap: 12px; flex-shrink: 0;
  }
  .topbar .breadcrumb { font-size: 9pt; color: #888; }
  .topbar .breadcrumb strong { color: #333; }
  .topbar .spacer { flex: 1; }
  .topbar .notif { font-size: 16pt; cursor: pointer; opacity: .5; }
  .topbar .notif:hover { opacity: 1; }
  /* ===== ROLE TABS ===== */
  .role-tabs {
    display: flex; background: #fff; border-bottom: 1px solid #e0e0e0;
    padding: 0 24px; gap: 0; flex-shrink: 0;
  }
  .role-tab {
    padding: 10px 18px; cursor: pointer; font-size: 9pt; font-weight: 600;
    color: #888; border-bottom: 3px solid transparent; transition: all .2s;
  }
  .role-tab:hover { color: #333; }
  .role-tab.active { color: #0a2463; border-bottom-color: #0a2463; }
  .role-tab .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
  }
  /* ===== CONTENT ===== */
  .content {
    flex: 1; overflow-y: auto; padding: 20px 24px; background: #f5f7fa;
  }
  .page { display: none; animation: fadeIn .4s; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  /* ===== WIDGETS ===== */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi-card {
    background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
    border-left: 4px solid #1e88e5;
  }
  .kpi-card .num { font-size: 22pt; font-weight: 800; color: #0a2463; line-height: 1.1; }
  .kpi-card .num.green { color: #2e7d32; }
  .kpi-card .num.red { color: #c62828; }
  .kpi-card .num.orange { color: #e65100; }
  .kpi-card .label { font-size: 8.5pt; color: #888; }
  .kpi-card .sub-label { font-size: 8pt; color: #aaa; }
  .card {
    background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
    margin-bottom: 14px;
  }
  .card h3 { font-size: 10.5pt; color: #0a2463; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 9pt; }
  th { background: #f5f7fa; color: #555; font-weight: 600; padding: 8px 10px; text-align: left; font-size: 8pt; text-transform: uppercase; }
  td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #f8faff; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 8pt; font-weight: 600;
  }
  .badge.green { background: #e8f5e9; color: #2e7d32; }
  .badge.blue { background: #e3f2fd; color: #1565c0; }
  .badge.orange { background: #fff3e0; color: #e65100; }
  .badge.red { background: #ffebee; color: #c62828; }
  .alert-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 6px; margin-bottom: 4px; font-size: 9pt;
  }
  .alert-row.red { background: #ffebee; border-left: 3px solid #c62828; }
  .alert-row.orange { background: #fff3e0; border-left: 3px solid #e65100; }
  .alert-row.green { background: #e8f5e9; border-left: 3px solid #2e7d32; }
  .chart-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 9pt; }
  .chart-bar .bar {
    height: 18px; border-radius: 4px; display: flex; align-items: center; padding-left: 8px;
    font-size: 8pt; color: #fff; font-weight: 600; min-width: 30px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .att-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 1px; }
  .att-dot.present { background: #43a047; }
  .att-dot.absent { background: #e53935; }
  .att-dot.justified { background: #ffa726; }
  .unit-card {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 8px;
  }
  .unit-card .progress { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 6px; }
  .unit-card .progress .fill { height: 100%; border-radius: 2px; background: #1e88e5; }
  .session-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 9pt; }
  .session-row .check { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8pt; color: #fff; }
  .check.done { background: #2e7d32; }
  .check.pending { background: #bbb; }
  .tooltip { position: relative; }
  .tooltip:hover:after {
    content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 8pt; white-space: nowrap; z-index: 10;
  }
  .ai-badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff;
    border-radius: 12px; font-size: 7.5pt; font-weight: 600;
  }
  .page-selector { display: flex; gap: 4px; margin: 0 24px; }
  .page-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; cursor: pointer; }
  .page-dot.active { background: #0a2463; }
  @media (max-width:800px) {
    .sidebar { width: 56px; }
    .sidebar .brand span, .sidebar .menu-item span, .sidebar .menu-title, .sidebar .user-card .name, .sidebar .user-card .role-label { display: none; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>

// ===== APP LOGIC =====
let currentRole = 'docente';
let currentPageIdx = 0;

function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  switchRole('docente');
}

function getMenuHtml(role) {
  const menu = roles[role].menu;
  return Object.entries(menu).map(([label, icon], i) =>
    `<div class="menu-item ${i===0?'active':''}" onclick="switchPage('${role}',${i})"><span class="icon">${icon}</span><span>${label}</span></div>`
  ).join('');
}

function switchRole(role) {
  currentRole = role;
  const data = roles[role];
  document.getElementById('menu').innerHTML = getMenuHtml(role);
  document.getElementById('user-avatar').textContent = data.avatar;
  document.getElementById('user-name').textContent = data.name;
  document.getElementById('user-role').textContent = data.role;
  document.querySelectorAll('.role-tab').forEach((t,i) => {
    const r = ['docente','director','distrito','regional','nacional'][i];
    t.classList.toggle('active', r === role);
  });
  currentPageIdx = 0;
  switchPage(role, 0);
}

function switchPage(role, idx) {
  currentPageIdx = idx;
  const data = roles[role] || roles.docente;
  const pageKey = data.pages[idx] || data.pages[0];
  const content = pageContent[`${role}-${pageKey}`] || pageContent[`docente-dashboard`];
  const menuItems = document.querySelectorAll('.menu-item');
  menuItems.forEach((item, i) => item.classList.toggle('active', i === idx));

  const labels = Object.keys(data.menu);
  document.getElementById('breadcrumb').innerHTML = `<strong>${labels[idx] || labels[0]}</strong> <span style="color:#888;font-weight:400;margin-left:6px;">${roleLabels[role]}</span>`;

  const dotsContainer = document.getElementById('page-dots');
  dotsContainer.innerHTML = data.pages.map((_, i) =>
    `<div class="page-dot ${i===idx?'active':''}"></div>`
  ).join('');

  document.getElementById('content').innerHTML = content;
}

const roleLabels = { docente: 'Docente', director: 'Director', distrito: 'Distrito Educativo', regional: 'Regional', nacional: 'Nacional (MINERD)' };
